apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "lk.pitaka.books"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 21
        versionName "3.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Play upload key (/Volumes/2TB/Android/pitaka.lk.jks); the alias and passwords are in ~/.gradle/gradle.properties:
    //   TIPITAKA_KEY_ALIAS=…  TIPITAKA_STORE_PASSWORD=…  (TIPITAKA_KEY_PASSWORD=… when it differs)
    signingConfigs {
        release {
            storeFile file('/Volumes/2TB/Android/pitaka.lk.jks')
            keyAlias findProperty('TIPITAKA_KEY_ALIAS') ?: ''
            storePassword findProperty('TIPITAKA_STORE_PASSWORD') ?: ''
            keyPassword findProperty('TIPITAKA_KEY_PASSWORD') ?: findProperty('TIPITAKA_STORE_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            if (findProperty('TIPITAKA_STORE_PASSWORD')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'lk.pitaka.books'

    // the pages are copied in by pitaka.lk's dev/sync-apps.sh at the same paths as on the web (assets/books/, assets/dhammapada/,
    // assets/tools/unicode/fonts/web/, assets/static/singlish-search/) and served by MainActivity at https://appassets.androidplatform.net/
    // the pictures and recordings are in install-time asset packs (their files appear in the same assets):
    //   jathaka_images_asset      assets/books/jathaka-images/*.webp
    //   dhammapada_media_asset    assets/dhammapada/{paintings/*.webp, thumbs/*.jpg, recordings/*.mp3}
    assetPacks = [":jathaka_images_asset", ":dhammapada_media_asset"]
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}